name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zsh-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: zsh -n on shell configs
        run: |
          for f in configs/zsh/.zshenv configs/zsh/.zprofile configs/zsh/.zshrc; do
            zsh -n "$f"
            echo "ok: $f"
          done

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: quality
      - name: Links and spelling
        run: |
          lychee --no-progress --max-concurrency 8 '**/*.md'
          typos

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          capability: security
      - name: Lint and audit workflows
        run: |
          actionlint
          zizmor --offline --no-progress .github
      - name: Scan new pull request commits, or the full history on main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
          else
            gitleaks git --no-banner --redact .
          fi

  gate:
    needs: [zsh-syntax, docs, workflows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/gate@ab62f45b2a3067e5a7425d703f7fd07f1618b72c # nddev-cicd-v0.6.14
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"zsh-syntax":"success","docs":"success","workflows":"success"}
