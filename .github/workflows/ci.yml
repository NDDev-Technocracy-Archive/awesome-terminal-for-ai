name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Bespoke job: zsh syntax check for the shipped shell configs.
  # No ci-workflows equivalent exists for this.
  # ---------------------------------------------------------------------------
  zsh-syntax:
    name: zsh syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@b4ffde65f46336488b8621a4f500c1c0b6c0f1df # v4.1.1
        with:
          persist-credentials: false

      - name: Install zsh
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      - name: zsh -n on shell configs
        run: |
          set -euo pipefail
          for f in configs/zsh/.zshenv configs/zsh/.zprofile configs/zsh/.zshrc; do
            zsh -n "$f"
            echo "ok: $f"
          done

  # ---------------------------------------------------------------------------
  # Reusable workflow calls (pinned to ci-workflows SHA).
  # ---------------------------------------------------------------------------
  docs-quality:
    name: docs-quality
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/docs-quality.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15

  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/actionlint.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15

  secret-scan:
    name: secret-scan
    permissions:
      contents: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/secret-scan.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15

  zizmor:
    name: zizmor (SARIF)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/zizmor-sarif.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15

  dependency-review:
    name: dependency-review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-dependency-review.yml@b05016e27151e2d5b3f07e1d856fff50f635ab15
